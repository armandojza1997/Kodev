    <script>
    (function(){
      try {
        // Prevent infinite reload loops triggered by WebSocket disconnects in iframe/proxy environments
        var originalReload = window.location.reload.bind(window.location);
        var lastReload = 0;
        window.location.reload = function() {
          var now = Date.now();
          if (now - lastReload < 10000) {
            console.warn('[Kodev] Prevenida recarga repetitiva automática');
            return;
          }
          lastReload = now;
          originalReload();
        };

        var r = document.documentElement;
        r.classList.add('k-page');
        window.__kxReveal = true;
        if (!window.matchMedia || !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          r.classList.add('rv-on');
        }
      } catch(e) {}
    })();
    </script>
